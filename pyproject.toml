[project]
name = "rea-web"
version = "0.1.0"
description = "Map an API or website into a usable client, docs and per-endpoint evidence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["playwright>=1.40", "PyYAML>=6"]

[project.scripts]
rea-web = "reaweb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reaweb*"]
